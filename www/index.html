<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#165e65" />
    <title>Chhayapoth · ছায়াপথ</title>
    <link rel="stylesheet" href="./chhayapoth/app.css" />
    <script src="./nativekit.js" data-nativekit-bridge></script>
    <script defer src="./chhayapoth/domain.js"></script>
    <script defer src="./chhayapoth/app.js"></script>
  </head>
  <body>
    <svg style="display: none" xmlns="http://www.w3.org/2000/svg">
      <symbol id="home" viewBox="0 0 24 24">
        <path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7" />
      </symbol>
      <symbol id="spark" viewBox="0 0 24 24">
        <path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z" />
      </symbol>
      <symbol id="calendar" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="16" rx="3" />
        <path d="M7 3v4m10-4v4M3 11h18m-13 5h1m6 0h1" />
      </symbol>
      <symbol id="grid" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="2" />
        <rect x="14" y="3" width="7" height="7" rx="2" />
        <rect x="3" y="14" width="7" height="7" rx="2" />
        <rect x="14" y="14" width="7" height="7" rx="2" />
      </symbol>
      <symbol id="plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="arrow" viewBox="0 0 24 24">
        <path d="M5 12h14m-6-6 6 6-6 6" />
      </symbol>
      <symbol id="bell" viewBox="0 0 24 24">
        <path d="M5 17h14l-2-4V9a5 5 0 0 0-10 0v4zm5 4h4" />
      </symbol>
      <symbol id="leaf" viewBox="0 0 24 24">
        <path d="M5 19C-2 8 13 4 21 3c0 11-4 19-13 14m-4 4L16 9" />
      </symbol>
      <symbol id="drop" viewBox="0 0 24 24">
        <path d="M12 3S5 11 5 15a7 7 0 0 0 14 0c0-4-7-12-7-12z" />
      </symbol>
      <symbol id="book" viewBox="0 0 24 24">
        <path
          d="M12 6C8 3 4 4 3 5v15c3-2 6-1 9 0 3-1 6-2 9 0V5c-3-2-6-1-9 1zm0 0v14"
        />
      </symbol>
      <symbol id="message" viewBox="0 0 24 24">
        <path
          d="M21 15a4 4 0 0 1-4 4H9l-6 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4zm-14-5h10m-10 4h6"
        />
      </symbol>
      <symbol id="settings" viewBox="0 0 24 24">
        <path d="M4 7h16M4 17h16" />
        <circle cx="9" cy="7" r="3" />
        <circle cx="15" cy="17" r="3" />
      </symbol>
      <symbol id="shield" viewBox="0 0 24 24">
        <path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6" />
      </symbol>
      <symbol id="bluetooth" viewBox="0 0 24 24">
        <path d="m7 6 10 12-5 4V2l5 4L7 18" />
      </symbol>
      <symbol id="clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="wallet" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="15" rx="3" />
        <path d="M3 8V5a2 2 0 0 1 2-2h12M16 11h5v5h-5z" />
      </symbol>
      <symbol id="chart" viewBox="0 0 24 24">
        <path d="M4 3v17h17M8 15v-4m5 4V6m5 9v-6" />
      </symbol>
      <symbol id="search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path d="m16 16 5 5" />
      </symbol>
      <symbol id="moon" viewBox="0 0 24 24">
        <path d="M20 15A8.5 8.5 0 0 1 9 4a8.5 8.5 0 1 0 11 11z" />
      </symbol>
    </svg>
    <a
      class="skip-link"
      id="skipLink"
      href="#content"
      onclick="
        event.preventDefault();
        document.getElementById('content').focus();
      "
      >মূল বিষয়ে যান</a
    >
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="logo">✳</span>
          <div>ছায়াপথ<small>CHHAYAPOTH</small></div>
        </div>
        <div class="side-label">আপনার ড্যাশবোর্ড</div>
        <nav id="desktopNav" aria-label="প্রধান বিভাগ"></nav>
        <div class="sidebar-bottom">
          <div class="offline">
            <span class="dot"></span><strong>নিজের তথ্য, নিজের নিয়ন্ত্রণ</strong
            ><br />ডেটা এই ডিভাইসে থাকে।<br />নিয়মিত ব্যাকআপ রাখুন।<br /><span
              class="network-status"
              id="networkState"
              >সংযোগ যাচাই হচ্ছে…</span
            >
          </div>
          <div class="profile">
            <div class="avatar">ছা</div>
            <div>
              <strong>ব্যক্তিগত ড্যাশবোর্ড</strong><br /><small
                >Chhayapoth · Alpha</small
              >
            </div>
          </div>
        </div>
      </aside>
      <main>
        <header class="topbar">
          <div class="crumb">
            <span class="mobile-brand">✳ ছায়াপথ</span
            ><span class="desktop-brand"
              >আপনার স্পেস <span class="crumb-separator">/</span></span
            ><span id="breadcrumb">ড্যাশবোর্ড</span>
          </div>
          <div class="top-actions">
            <button
              class="search-trigger"
              onclick="openSearch()"
              aria-label="নিজের রেকর্ড খুঁজুন"
            >
              <svg aria-hidden="true"><use href="#search" /></svg
              ><span>রেকর্ড খুঁজুন</span></button
            ><button
              class="iconbtn"
              data-theme-toggle
              aria-pressed="false"
              aria-label="অন্ধকার রঙের মোড"
              onclick="toggleTheme()"
            >
              <svg aria-hidden="true"><use href="#moon" /></svg></button
            ><button
              class="iconbtn"
              aria-label="সেটিংস খুলুন"
              onclick="go('settings')"
            >
              <svg aria-hidden="true"><use href="#settings" /></svg>
            </button>
          </div>
        </header>
        <div id="content" tabindex="-1">
          <p class="empty">আপনার স্পেস লোড হচ্ছে…</p>
        </div>
        <footer class="bottom-note">
          <svg><use href="#shield" /></svg>লোকাল রেকর্ড · নিয়মিত ব্যাকআপ রাখুন
        </footer>
      </main>
    </div>
    <nav class="mobile-nav" id="mobileNav" aria-label="মূল বিভাগ"></nav>
    <div id="modal" class="modal hidden"></div>
    <div id="toast" class="toast hidden" role="status"></div>
  </body>
</html>
