function tools(id){return `<div class="edit-tools"><button onclick="moveWidget('${id}')" aria-label="Widget উপরে সরান">↑</button><button onclick="removeWidget('${id}')" aria-label="Widget সরান">×</button></div>`}
function head(t,s,action=''){return `<div class="hero"><div><div class="eyebrow">${s}</div><h1>${t}</h1></div>${action}</div>`}
function home(){return `${head('দিনটা হোক আপনার মতো।','রবিবার, ১ নভেম্বর ২০২৬',`<button class="btn" onclick="edit=!edit;render()">${ic('settings')}${edit?'সম্পন্ন':'হোম সাজান'}</button>`)}<div class="grid ${edit?'editing':''}"><div class="stack"><section class="card ai-card"><div class="ai-tag">${ic('spark')} YOUR EVERYDAY COPILOT</div><h2>কম ব্যস্ততা,<br>আরও একটু নিজের সময়।</h2><p>পরিকল্পনা, অভ্যাস আর ছোট ছোট কাজ—সবকিছু একসঙ্গে গুছিয়ে নিতে আমি আছি।</p><form class="command" onsubmit="event.preventDefault();askAI(this.q.value)"><input name="q" aria-label="AI-কে বলুন" placeholder="আজকের দিনটা গুছিয়ে দাও…" required><button aria-label="পাঠান">${ic('arrow')}</button></form><div class="quick"><button onclick="askAI('আজকের দিনটা গুছিয়ে দাও')">দিনের পরিকল্পনা</button><button onclick="askAI('একটি habit widget যোগ করো')">Widget তৈরি</button><button onclick="askAI('একটি mini-app তৈরি করো')">Mini-app বানাও</button></div></section><div class="mini-stats"><div class="stat"><strong>${events.filter(e=>e.day===1).length}</strong><span>আজ</span><small>পরিকল্পিত কাজ</small></div><div class="stat"><strong>${habits.filter(h=>h.done).length}/${habits.length}</strong><small>অভ্যাস সম্পন্ন</small></div><div class="stat"><strong>৭</strong><span>দিন</span><small>ধারাবাহিকতা · demo</small></div></div>${widgets.includes('agenda')?agenda(1):''}${widgets.includes('focus')?`<section class="card"><div class="card-head"><span class="card-title">${ic('clock')} ফোকাস স্পেস</span>${tools('focus')}</div><h2 style="font-size:30px">২৫ : ০০</h2><p class="sub">AI-created template · demo, timer চালু নয়</p></section>`:''}<button class="btn" style="border-style:dashed;padding:16px;color:var(--muted)" onclick="go('store')">${ic('plus')} আপনার স্পেসে widget যোগ করুন</button></div><div class="stack"><section class="card"><div class="card-head"><span class="card-title">নভেম্বর ২০২৬</span><button class="link" onclick="go('calendar')">ক্যালেন্ডার ↗</button></div>${calGrid(10,2026,true)}</section>${widgets.includes('habits')?habitCard():''}${widgets.includes('mini')?`<section class="card"><div class="card-head"><span class="card-title">আপনার mini-apps</span>${tools('mini')}<button class="link" onclick="go('apps')">সব দেখুন ↗</button></div><div class="mini-apps"><button onclick="go('habits')"><span class="appicon mint">${ic('leaf')}</span>অভ্যাস</button><button onclick="go('messages')"><span class="appicon blue">${ic('message')}</span>Messages</button><button onclick="go('apps')"><span class="appicon">${ic('plus')}</span>আরও যোগ</button></div></section>`:''}</div></div>`}
function agenda(day){let es=events.filter(e=>e.day===day).sort((a,b)=>a.time.localeCompare(b.time));return `<section class="card"><div class="card-head"><span class="card-title">${ic('calendar')}${day===1?'আজকের পরিকল্পনা':day+' তারিখের পরিকল্পনা'}</span>${tools('agenda')}<button class="link" onclick="eventModal(${day})">+ নতুন</button></div>${es.length?es.map((e,i)=>`<div class="event"><div class="event-time">${esc(e.time)}</div><div class="event-box ${i%2?'blue':''}"><strong>${esc(e.title)}</strong><p>${esc(e.sub)}</p></div></div>${i===0?'<div class="today-line">একটু বিরতি, একটু স্বস্তি</div>':''}`).join(''):'<p class="section-desc">এখনও কোনো পরিকল্পনা নেই। নিজের মতো দিনটি সাজান।</p>'}</section>`}
function calGrid(m,y,mini=false){let first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();return `<div class="days">${['রবি','সোম','মঙ্গল','বুধ','বৃহঃ','শুক্র','শনি'].map(x=>'<span>'+x+'</span>').join('')}</div><div class="calgrid">${'<span></span>'.repeat(first)}${Array.from({length:count},(_,i)=>`<button class="${i+1===selected?'selected ':''}${events.some(e=>e.day===i+1)&&m===10?'has':''}" onclick="selectDay(${i+1},${mini})">${i+1}</button>`).join('')}</div>`}
function selectDay(d,mini){selected=d;if(mini){page='calendar';month=10;year=2026}render()}
function habitCard(){let done=habits.filter(h=>h.done).length;return `<section class="card"><div class="card-head"><span class="card-title">${ic('leaf')} একটু একটু করে, প্রতিদিন</span>${tools('habits')}<button class="link" onclick="go('habits')">সব ↗</button></div><div class="row space"><span class="sub">আজকের অগ্রগতি</span><strong style="font-size:11px">${done}/${habits.length}</strong></div><div class="progress"><div style="width:${done/habits.length*100}%"></div></div>${habits.map((h,i)=>`<div class="habit"><span class="habit-icon">${ic(h.icon)}</span><div class="habit-name">${esc(h.name)}<small>${esc(h.sub)}</small></div><button class="check ${h.done?'done':''}" aria-label="${esc(h.name)} ${h.done?'অসম্পন্ন করুন':'সম্পন্ন করুন'}" aria-pressed="${h.done}" onclick="toggleHabit(${i})">${h.done?'✓':''}</button></div>`).join('')}</section>`}
function toggleHabit(i){habits[i].done=!habits[i].done;render();toast('Habit demo state আপডেট হয়েছে; আসল h.html database অপরিবর্তিত।')}
function calendar(){return `${head('আপনার সময়, এক নজরে।','CALENDAR & DAILY PLANNER',`<button class="btn primary" onclick="eventModal(${selected})">${ic('plus')} নতুন পরিকল্পনা</button>`)}<p class="section-desc">Planner UI preview · আপনার দেওয়া Calendar-এর document editor ও database পরবর্তী অনুমোদিত ধাপে যুক্ত হবে।</p><div class="grid"><section class="card"><div class="card-head"><button class="btn" onclick="changeMonth(-1)" aria-label="আগের মাস">←</button><strong>${new Date(year,month,1).toLocaleDateString('bn-BD',{month:'long',year:'numeric'})}</strong><button class="btn" onclick="changeMonth(1)" aria-label="পরের মাস">→</button></div>${calGrid(month,year)}</section><div>${month===10&&year===2026?agenda(selected):'<section class="card"><p class="section-desc">এই মাসে demo event নেই। Event creation demo নভেম্বর ২০২৬-এ সীমাবদ্ধ।</p></section>'}<div class="notice" style="margin-top:16px">Timezone: Asia/Dhaka · demo। Recurrence, reminders ও documents এখনো সংযুক্ত নয়।</div></div></div>`}
function changeMonth(n){month+=n;if(month<0){month=11;year--}if(month>11){month=0;year++}selected=1;render()}
function eventModal(day){if(page==='calendar'&&(month!==10||year!==2026)){toast('Demo event যোগ করতে নভেম্বর ২০২৬ বেছে নিন।');return}openModal(`<h2>নতুন পরিকল্পনা</h2><p class="section-desc">নভেম্বর ${day}, ২০২৬ · demo session only</p><form onsubmit="event.preventDefault();addEvent(this,${day})"><label>কাজের নাম<input name="title" required maxlength="100" placeholder="যেমন: বিকেলের হাঁটা"></label><label>সময়<input name="time" type="time" value="17:00" required></label><button class="btn primary">পরিকল্পনায় রাখুন</button></form>`)}
function addEvent(f,d){events.push({day:d,title:f.title.value.trim(),time:f.time.value,sub:'আপনার যোগ করা demo পরিকল্পনা'});closeModal();render();toast('Demo event যোগ হয়েছে; native reminder schedule হয়নি।')}
function ai(){return `${head('কী গুছিয়ে দেব আজ?','AI AGENT',`<span class="switch">Advanced · demo</span>`)}<p class="section-desc">আপনার নির্বাচিত automation mode। এখানে responses scripted—কোনো AI provider বা native tool call হচ্ছে না।</p><section class="card"><div id="chatLog" class="chat">${chat.length?chat.map(x=>x.type==='tool'?x.html:`<div class="bubble ${x.type==='user'?'user':''}">${esc(x.text)}</div>`).join(''):`<div class="bubble">আমি আপনার planner, habits ও widgets এক জায়গায় গুছিয়ে দিতে পারব।<br>এই preview-এ নিচের demo command চেষ্টা করুন।</div>`}</div><form class="command" onsubmit="event.preventDefault();askAI(this.q.value)"><input name="q" required aria-label="AI message" placeholder="যেমন: একটি focus widget তৈরি করো"><button aria-label="পাঠান">${ic('arrow')}</button></form><div class="quick"><button onclick="askAI('আজকের দিনটা গুছিয়ে দাও')">দিনের পরিকল্পনা</button><button onclick="askAI('একটি focus widget তৈরি করো')">Focus widget</button><button onclick="askAI('একটি mini-app তৈরি করো')">Mini-app তৈরি</button></div></section>`}
function askAI(q){if(!q.trim())return;page='ai';chat.push({type:'user',text:q});if(/widget|উইজেট|focus/i.test(q)){previous=[...widgets];if(!widgets.includes('focus'))widgets.push('focus');chat.push({type:'bot',text:'Demo automation: আপনার হোমে একটি Focus widget template যোগ করেছি। Advanced mode-এর simulated action; কোনো generated code চালানো হয়নি।'},{type:'tool',html:'<div class="tool-card"><strong>✓ home.widget.add · simulated</strong>২৫ মিনিটের Focus card → Home<br><button class="btn" onclick="go(\'home\')">হোমে দেখুন</button> <button class="btn" onclick="undo()">Undo</button></div>'})}else if(/mini|মিনি/i.test(q)){chat.push({type:'bot',text:'একটি ছোট Notes mini-app-এর draft workflow দেখাতে পারি। বাস্তব code generation, package validation ও install এখনও সংযুক্ত নয়।'},{type:'tool',html:'<div class="tool-card"><strong>Mini-app draft · preview only</strong>নাম: Quick Notes · storage: app-private · network: off<br><button class="btn" onclick="go(\'apps\')">Library দেখুন</button></div>'})}else{chat.push({type:'bot',text:`আজ ${events.filter(e=>e.day===1).length}টি demo পরিকল্পনা রয়েছে। ${habits.filter(h=>!h.done).length}টি অভ্যাস বাকি। কাজের মাঝে নিজের জন্য বিরতি রাখুন।\nচাইলে “একটি focus widget তৈরি করো” লিখে demo automation দেখুন।`})}render()}
function undo(){if(previous){widgets=previous;previous=null;toast('সর্বশেষ demo layout action ফিরিয়ে নেওয়া হয়েছে।')}else toast('Undo করার মতো action নেই।')}
function more(){let cards=[['messages','message','Messages','কাছের মানুষ, ইন্টারনেট ছাড়াই'],['habits','leaf','অভ্যাস','আজকের ছোট পদক্ষেপ, আগামী দিনের পরিবর্তন'],['apps','grid','Mini-app library','আপনার প্রয়োজনের ছোট ছোট অ্যাপ'],['store','plus','Widget Store','নিজের মতো করে সাজান আপনার স্পেস'],['ai','spark','Create with AI','একটি ধারণা থেকে নতুন mini-app'],['settings','settings','সেটিংস ও নিয়ন্ত্রণ','Automation, privacy ও appearance']];return `${head('আরও কিছু, আপনার জন্য।','EXPLORE YOUR SPACE')}<div class="menu-grid">${cards.map(([p,i,t,s])=>`<button class="menu-card" onclick="go('${p}')"><span class="appicon mint">${ic(i)}</span><div><strong>${t}</strong><small>${s}</small></div><span style="margin-left:auto;color:var(--muted)">↗</span></button>`).join('')}</div>`}
function habitPage(){return `${head('ভালো অভ্যাসের ছোট শুরু।','HABIT TRACKER',`<button class="btn primary" onclick="habitModal()">${ic('plus')} নতুন অভ্যাস</button>`)}<p class="section-desc">আপনার ProFit tracker-এর জন্য নতুন সহজ entry point। Original analytics, import ও history পরবর্তী integration-এ অক্ষুণ্ণ রাখার পরিকল্পনা।</p><div class="grid"><div>${habitCard()}</div><section class="card"><span class="eyebrow">CONSISTENCY, NOT PERFECTION</span><h2 style="font-size:44px;font-weight:500;margin:22px 0 5px">৭ <small style="font-size:17px">দিন</small></h2><p class="sub">Demo streak · আসল statistics নয়</p><div class="row" style="margin:27px 0">${['সো','ম','বু','বৃ','শু','শ','র'].map((x,i)=>`<span class="avatar" style="background:${i<6?'#dce8c9':'#f0f1e9'}">${x}</span>`).join('')}</div><div class="notice">এই prototype-এর habit check বা নতুন habit আপনার আপলোড করা h.html-এর ProFitDB-তে লেখা হচ্ছে না।</div></section></div>`}
function habitModal(){openModal('<h2>ছোট একটি ভালো অভ্যাস</h2><form onsubmit="event.preventDefault();habits.push({name:this.name.value.trim(),sub:\'আজ থেকে শুরু · demo\',icon:\'leaf\',done:false});closeModal();render()"><label>অভ্যাসের নাম<input name="name" required maxlength="70" placeholder="যেমন: প্রতিদিন ১০ মিনিট পড়া"></label><button class="btn primary">যোগ করুন</button></form>')}
let storeTab='inapp';function store(){let items=[['দিনের agenda','calendar','আজকের কাজ ও upcoming পরিকল্পনা।'],['Habit progress','leaf','ছোট ছোট পদক্ষেপের এক নজরের হিসাব।'],['Focus timer','clock','২৫ মিনিটের focus card template।'],['Quick Notes','book','নোটের mini-app concept; editor এখনও নেই।']];return `${head('একটু বেশি আপনার মতো।','WIDGET STORE')}<p class="section-desc">Curated local library · public submissions/backend এখনও নেই।</p><div class="row" style="margin-bottom:22px">${[['inapp','ইন-অ্যাপ'],['launcher','ফোনের হোম'],['floating','Floating']].map(([id,t])=>`<button class="btn ${storeTab===id?'primary':''}" onclick="storeTab='${id}';render()">${t}</button>`).join('')}</div>${storeTab!=='inapp'?`<div class="notice" style="margin-bottom:20px">${storeTab==='floating'?'Floating overlay শুধু Android-এ; OS permission দরকার। iOS-এ এই সুবিধা নেই।':'Launcher widgets native build ও OS confirmation চায়; iOS WidgetKit setup আলাদা।'} এই prototype native widget install করে না।</div>`:''}<div class="store-grid">${items.map(([t,i,s])=>`<article class="store-item"><span class="appicon mint">${ic(i)}</span><h3>${t}</h3><p>${s}</p><button class="btn ${installed.has(t)?'':'primary'}" onclick="install('${t}')">${installed.has(t)?'যোগ করা আছে ✓':'হোমে যোগ করুন +'}</button></article>`).join('')}</div>`}
function install(t){if(storeTab!=='inapp'){toast('Native capability preview only; এখানে install করা হয়নি।');return}if(t==='Quick Notes'){go('apps');return}installed.add(t);let id=({'দিনের agenda':'agenda','Habit progress':'habits','Focus timer':'focus'})[t];if(!widgets.includes(id))widgets.push(id);render();toast('Demo Home layout-এ widget যোগ হয়েছে।')}
function removeWidget(id){widgets=widgets.filter(x=>x!==id);let name=({agenda:'দিনের agenda',habits:'Habit progress',focus:'Focus timer'})[id];installed.delete(name);render()}
function moveWidget(id){if(id==='mini'||id==='habits'){toast('Prototype-এ এই card-এর column স্থির; resize/drag পরের ধাপ।');return}toast('Prototype layout fixed columns; পূর্ণ reorder এখনও বাস্তবায়িত নয়।')}
function apps(){return `${head('ছোট অ্যাপ, বড় সুবিধা।','YOUR MINI-APP LIBRARY',`<button class="btn primary" onclick="askAI('একটি mini-app তৈরি করো')">${ic('spark')} AI দিয়ে তৈরি</button>`)}<div class="notice" style="margin-bottom:20px">Prototype library · কোনো uploaded code চালানো হবে না। আসল package install-এর সময় sandbox, manifest এবং permissions যাচাই হবে।</div><div class="menu-grid"><button class="menu-card" onclick="go('habits')">${ic('leaf')}<div><strong>ProFit Habits</strong><small>আপনার h.html · integration pending</small></div></button><button class="menu-card" onclick="go('calendar')">${ic('calendar')}<div><strong>Pro Planner</strong><small>আপনার Calendar · integration pending</small></div></button><button class="menu-card" onclick="importModal()">${ic('plus')}<div><strong>Import mini-app</strong><small>HTML / ZIP · demo metadata preview</small></div></button><button class="menu-card" onclick="toast('Public submission পরবর্তী backend milestone-এ।')">${ic('grid')}<div><strong>Submit to store</strong><small>পরবর্তী ধাপ · এখন local library</small></div></button></div>`}
function importModal(){openModal('<h2>আপনার mini-app আনুন</h2><p class="section-desc">এখানে শুধু file name/size দেখানো হবে; file execute, install বা server-এ upload করা হবে না।</p><input type="file" accept=".html,.zip,.js,.mjs" onchange="filePreview(this)"><div id="fileInfo" class="notice">একটি ফাইল বেছে নিন।</div>')}
function filePreview(input){let f=input.files[0];if(f)$('fileInfo').textContent=f.name+' · '+Math.ceil(f.size/1024)+' KB · metadata preview only; security validation হয়নি।'}
function messaging(){return `${head('কাছেই থাকুক কথাগুলো।','MESSAGES · NEARBY')}<p class="section-desc">Offline nearby messaging-এর UX preview। Bluetooth/Wi-Fi discovery বা অন্য device-এ delivery হচ্ছে না।</p><div class="grid"><section class="card"><div class="card-head"><span class="card-title">${ic('bluetooth')} Nearby devices</span><span class="pill">SIMULATION</span></div><p class="section-desc">দুই ফোনে discovery, permission এবং connection acceptance লাগবে।</p><button class="btn primary" onclick="discover()">${ic('bluetooth')} Demo discovery দেখুন</button><div id="peers" style="margin-top:20px"></div></section><section class="card"><span class="card-title">${ic('message')} Demo conversation</span><div class="chat" style="min-height:200px;max-height:300px">${messages.length?messages.map(m=>`<div class="bubble user">${esc(m)}<br><small style="opacity:.6;font-size:9px">Local preview only · পাঠানো হয়নি</small></div>`).join(''):'<p class="section-desc">এখানে message draft করে preview দেখতে পারেন। কোনো remote recipient নেই।</p>'}</div><form class="command" onsubmit="event.preventDefault();messages.push(this.msg.value);render();toast('শুধু local preview; Bluetooth message পাঠানো হয়নি।')"><input name="msg" required maxlength="1000" aria-label="Message draft" placeholder="একটি demo message…"><button aria-label="Preview message">${ic('arrow')}</button></form></section></div>`}
function discover(){let p=$('peers');p.innerHTML='<p class="sub">Demo device খোঁজার animation…</p>';setTimeout(()=>{if($('peers'))$('peers').innerHTML='<div class="notice"><strong>Demo Phone · fictional device</strong><br>এটি কোনো বাস্তব scan result নয়।<br><button class="btn" style="margin-top:10px" onclick="toast(\'Pairing preview: দুই device-এ একই code যাচাই করতে হবে। এখন connection হয়নি।\')">Pairing flow দেখুন</button></div>'},650)}
function settings(){return `${head('নিয়ন্ত্রণ থাকুক আপনার হাতে।','SETTINGS & PRIVACY')}<section class="card"><div class="row space"><div><strong>AI automation</strong><p class="section-desc">আপনার বেছে নেওয়া Advanced mode · scoped authority</p></div><select class="btn" aria-label="AI permission mode" onchange="toast('Prototype setting only; native policy পরিবর্তন হয়নি।')"><option>Advanced</option><option>Balanced</option><option>Safe</option></select></div><div class="notice">Advanced মানে OS permission বা sandbox bypass নয়। Data deletion, bulk changes এবং বাইরে message/data পাঠানোর জন্য পৃথক scopes ও audit থাকবে।</div><div class="row space" style="margin-top:25px"><strong>Appearance</strong><button class="btn" onclick="document.body.classList.toggle('dark')">Light / Dark</button></div><div class="row space" style="margin-top:25px"><strong>Prototype data</strong><button class="btn" onclick="location.reload()">Demo reset</button></div><p class="section-desc" style="margin-top:24px">Data শুধু এই tab-এর memory-তে আছে। Reload করলে reset হবে। কোনো real account, cloud sync, AI provider বা native transport যুক্ত নয়।</p></section>`}
function openModal(html){$('modal').innerHTML=`<section class="modal-card" role="dialog" aria-modal="true" aria-label="Demo form"><div style="text-align:right"><button class="btn" onclick="closeModal()">বন্ধ ×</button></div>${html}</section>`;$('modal').classList.remove('hidden');let el=$('modal').querySelector('input,button');if(el)el.focus()}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});render();
</script></body></html>
